name: Social Autopilot
on:
  schedule:
    - cron: "17 * * * *"      # every hour: post anything due, plan ahead, learn from results
  workflow_dispatch:
permissions:
  contents: write
concurrency: autopilot
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y fonts-dejavu-core >/dev/null
      - run: pip install -r requirements.txt
      - name: Run autopilot
        env:
          HOINOW_FB_PAGE_ID: ${{ secrets.HOINOW_FB_PAGE_ID }}
          HOINOW_FB_TOKEN: ${{ secrets.HOINOW_FB_TOKEN }}
          HOINOW_IG_USER_ID: ${{ secrets.HOINOW_IG_USER_ID }}
          FINEHOMELOAN_FB_PAGE_ID: ${{ secrets.FINEHOMELOAN_FB_PAGE_ID }}
          FINEHOMELOAN_FB_TOKEN: ${{ secrets.FINEHOMELOAN_FB_TOKEN }}
          FINEHOMELOAN_IG_USER_ID: ${{ secrets.FINEHOMELOAN_IG_USER_ID }}
          HOINOW_LINKEDIN_TOKEN: ${{ secrets.HOINOW_LINKEDIN_TOKEN }}
          HOINOW_LINKEDIN_AUTHOR: ${{ secrets.HOINOW_LINKEDIN_AUTHOR }}
          FINEHOMELOAN_LINKEDIN_TOKEN: ${{ secrets.FINEHOMELOAN_LINKEDIN_TOKEN }}
          FINEHOMELOAN_LINKEDIN_AUTHOR: ${{ secrets.FINEHOMELOAN_LINKEDIN_AUTHOR }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          HOINOW_GBP_REFRESH_TOKEN: ${{ secrets.HOINOW_GBP_REFRESH_TOKEN }}
          HOINOW_GBP_ACCOUNT_ID: ${{ secrets.HOINOW_GBP_ACCOUNT_ID }}
          HOINOW_GBP_LOCATION_ID: ${{ secrets.HOINOW_GBP_LOCATION_ID }}
          FINEHOMELOAN_GBP_REFRESH_TOKEN: ${{ secrets.FINEHOMELOAN_GBP_REFRESH_TOKEN }}
          FINEHOMELOAN_GBP_ACCOUNT_ID: ${{ secrets.FINEHOMELOAN_GBP_ACCOUNT_ID }}
          FINEHOMELOAN_GBP_LOCATION_ID: ${{ secrets.FINEHOMELOAN_GBP_LOCATION_ID }}
          HOINOW_PINTEREST_TOKEN: ${{ secrets.HOINOW_PINTEREST_TOKEN }}
          HOINOW_PINTEREST_BOARD_ID: ${{ secrets.HOINOW_PINTEREST_BOARD_ID }}
          FINEHOMELOAN_PINTEREST_TOKEN: ${{ secrets.FINEHOMELOAN_PINTEREST_TOKEN }}
          FINEHOMELOAN_PINTEREST_BOARD_ID: ${{ secrets.FINEHOMELOAN_PINTEREST_BOARD_ID }}
          HOINOW_THREADS_USER_ID: ${{ secrets.HOINOW_THREADS_USER_ID }}
          HOINOW_THREADS_TOKEN: ${{ secrets.HOINOW_THREADS_TOKEN }}
          FINEHOMELOAN_THREADS_USER_ID: ${{ secrets.FINEHOMELOAN_THREADS_USER_ID }}
          FINEHOMELOAN_THREADS_TOKEN: ${{ secrets.FINEHOMELOAN_THREADS_TOKEN }}
          HOINOW_BLUESKY_HANDLE: ${{ secrets.HOINOW_BLUESKY_HANDLE }}
          HOINOW_BLUESKY_APP_PASSWORD: ${{ secrets.HOINOW_BLUESKY_APP_PASSWORD }}
          FINEHOMELOAN_BLUESKY_HANDLE: ${{ secrets.FINEHOMELOAN_BLUESKY_HANDLE }}
          FINEHOMELOAN_BLUESKY_APP_PASSWORD: ${{ secrets.FINEHOMELOAN_BLUESKY_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m autopilot run
      - name: Save queue, images and dashboard
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "autopilot: $(date -u +%F' '%H:%M)"
          git push
      - name: Open an issue if posting failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Social Autopilot run failed $(date -u +%F)" --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
